  // Split the text into individual publications
  const publications = publicationsText.split('\n\n');
  const publicationList = document.getElementById('publication-list');

  // Parse into objects for easy sorting
  const parsedPublications = [];
  publications.forEach(publication => {
    if (!publication.trim()) return;
    const yearMatch = publication.match(/year={([^}]*)}/);
    const citationCountMatch = publication.match(/citation_count={([^}]*)}/i);
    
    parsedPublications.push({
      text: publication,
      year: yearMatch ? parseInt(yearMatch[1]) : 0,
      citations: citationCountMatch ? parseInt(citationCountMatch[1]) : 0
    });
  });

  function renderItem(publication) {
      const titleMatch = publication.match(/title={([^}]*)}/);
      const authorMatch = publication.match(/author={([^}]*)}/);
      const volumeMatch = publication.match(/volume={([^}]*)}/);
      const publisherMatch = publication.match(/publisher={([^}]*)}/);
      const journalMatch = publication.match(/journal={([^}]*)}/);
      
      const citationMatch = publication.match(/citation={([^}]*)}/);
      const citationCountMatch = publication.match(/citation_count={([^}]*)}/i);
      const rankMatch = publication.match(/rank={([^}]*)}/i);
      const ifMatch = publication.match(/impactfactor={([^}]*)}/i);

      if (titleMatch && authorMatch) {
        const title = titleMatch[1];
        let authors = authorMatch[1].split(' and ').map(author => {
          const parts = author.split(',');
          if (parts.length > 1) {
            const [lastName, firstName] = parts.map(name => name.trim());
            return `${firstName} ${lastName}`;
          }
          return author.trim();
        }).join(', ');
        
        // Highlight Zulfiqar Ahmad Khan
        authors = authors.replace(/(Zulfiqar Ahmad Khan|Zulfiqar Khan|Z\.?\s*Khan|Zulfiqar A\.? Khan)/gi, '<span style="color: #4facfe;">$1</span>');
        
        let journal = journalMatch ? journalMatch[1] : '';
        const volume = volumeMatch ? volumeMatch[1] : '';
        const publisher = publisherMatch ? publisherMatch[1] : '';
        
        if (/[^\x00-\x7F]/.test(journal)) journal = 'Korean Local Journal';
        
        const urlMatch = publication.match(/url={([^}]*)}/);
        const doiMatch = publication.match(/doi={([^}]*)}/);
        
        let link = "";
        if (urlMatch) link = urlMatch[1];
        else if (doiMatch) link = "https://doi.org/" + doiMatch[1];
        else link = `https://scholar.google.com/scholar?q=${encodeURIComponent(title)}`;

        let extraInfo = [];
        if (volume) extraInfo.push(`Volume: ${volume}`);
        if (publisher) extraInfo.push(`Publisher: ${publisher}`);
        if (journal) extraInfo.push(`Journal: ${journal}`);

        let citationText = citationMatch ? citationMatch[1] : '';
        let citationCount = citationCountMatch ? citationCountMatch[1] : '';
        let rankText = rankMatch ? rankMatch[1] : '';
        let ifText = ifMatch ? ifMatch[1] : '';

        let citationHtml = '';
        if (citationText) {
            citationHtml = `<div style="font-size: 15px; font-style: italic; margin-bottom: 6px; color: #e0e0e0;">${citationText}</div>`;
        }

        const listItem = document.createElement('li');
        listItem.style.marginBottom = '25px';
        listItem.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;">
            <div style="flex: 1;">
                <a href="${link}" target="_blank" style="color: #00f2fe; text-decoration: none; display: block; font-size: 18px; margin-bottom: 4px; font-weight: 700; transition: color 0.2s;" onmouseover="this.style.color='#fff';" onmouseout="this.style.color='#00f2fe';">${title}</a>
                ${citationHtml}
                <div style="margin-bottom: 6px; font-size: 15px;">Authors: ${authors}</div>
                <div style="opacity: 0.8; font-size: 14px;">${extraInfo.join('<br>')}</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; min-width: 80px; padding-top: 5px;">
                ${citationCount !== null && citationCount !== undefined ? `
                <div style="text-align: center; margin-bottom: 8px;">
                    <div style="font-size: 11px; font-weight: 600; color: #00f2fe; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">Citations</div>
                    <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(0,242,254,0.15); border: 2px solid rgba(0,242,254,0.8); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; margin: 0 auto; box-shadow: 0 0 10px rgba(0,242,254,0.4);" title="Citations">
                        ${citationCount}
                    </div>
                </div>` : ''}
                <div style="display: flex; flex-direction: column; gap: 5px; width: 100%; align-items: center;">
                    ${rankText ? `<span style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: 600; color: #e0e0e0; width: 100%; text-align: center; letter-spacing: 0.5px;">Rank: ${rankText}</span>` : ''}
                    ${ifText ? `<span style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: 600; color: #e0e0e0; width: 100%; text-align: center; letter-spacing: 0.5px;">IF: ${ifText}</span>` : ''}
                </div>
            </div>
        </div>`;
        publicationList.appendChild(listItem);
      }
  }

  function renderPublications(sortBy) {
    publicationList.innerHTML = '';
    
    if (sortBy === 'year') {
      const byYear = {};
      parsedPublications.forEach(pub => {
        if (!byYear[pub.year]) byYear[pub.year] = [];
        byYear[pub.year].push(pub.text);
      });
      
      Object.keys(byYear).sort((a, b) => b - a).forEach(year => {
        const yearHeader = document.createElement('div');
        yearHeader.classList.add('year-header');
        yearHeader.textContent = year;
        publicationList.appendChild(yearHeader);
        
        byYear[year].forEach(pubText => renderItem(pubText));
      });
    } else if (sortBy === 'citation') {
      const sorted = [...parsedPublications].sort((a, b) => b.citations - a.citations);
      sorted.forEach(pub => renderItem(pub.text));
    }
  }

  // Initial render
  renderPublications('year');

  // Setup buttons
  const btnYear = document.getElementById('sort-year');
  const btnCitation = document.getElementById('sort-citation');

  btnYear.addEventListener('click', () => {
    btnYear.style.border = '1px solid rgba(0,242,254,0.5)';
    btnYear.style.background = 'rgba(0,242,254,0.2)';
    btnYear.style.color = '#00f2fe';
    
    btnCitation.style.border = '1px solid rgba(255,255,255,0.1)';
    btnCitation.style.background = 'transparent';
    btnCitation.style.color = '#fff';
    
    renderPublications('year');
  });

  btnCitation.addEventListener('click', () => {
    btnCitation.style.border = '1px solid rgba(0,242,254,0.5)';
    btnCitation.style.background = 'rgba(0,242,254,0.2)';
    btnCitation.style.color = '#00f2fe';
    
    btnYear.style.border = '1px solid rgba(255,255,255,0.1)';
    btnYear.style.background = 'transparent';
    btnYear.style.color = '#fff';
    
    renderPublications('citation');
  });
</script>
