<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="./assets/images/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      margin: auto;
      padding: 20px;
    }

    #publication-list {
      list-style: none;
      padding: 0;
    }

    #publication-list li {
      background-color: #292929;
      padding: 20px;
      margin-bottom: 20px;
    }

    #publication-list li strong {
      font-weight: bold;
      color: #ffcc00;
    }

    #publication-list li .authors {
      color: #66ff66;
    }

    #publication-list li .journal {
      color: #ffcc00;
    }

    #publication-list li .volume {
      color: #ff6666;
    }

    #publication-list li .year {
      color: #ff9933;
    }

    #publication-list li .publisher {
      color: #cc99ff;
    }

    .year-header {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }

    @media only screen and (max-width: 600px) {
      .container {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="main-content">
      <nav class="navbar">
        <ul class="navbar-list">
          
          <li class="navbar-item">
            <a href="index.html" class="navbar-link" data-nav-link>
              <button class="navbar-link" data-nav-link>About</button>
            </a>
          </li>
          
          <li class="navbar-item">
            <a href="publications.html" class="navbar-link" data-nav-link>
              <button class="navbar-link" data-nav-link>Publication</button>
            </a>
          </li>
          
          <li class="navbar-item">
			<a href="CV.html" class="navbar-link" data-nav-link>
            <button class="navbar-link" data-nav-link>CV</button>
             </a> 
          </li>
          
          
          <li class="navbar-item">
			<a href="Contact.html" class="navbar-link" data-nav-link>
            <button class="navbar-link active" data-nav-link>Contact</button>
             </a> 
          </li>
          
        </ul>
      </nav>
      <article class="about active" data-page="Contact">
        <h2 class="h2 article-title" ; style="color: hsl(45, 100%, 72%);">Contact</h2>
        <section class="mapbox" data-mapbox style = "margin-top: 50px">
          <figure>
            <iframe src="https://maps.google.com/maps?q=Ume%C3%A5%20University,%20Sweden&t=&z=13&ie=UTF8&iwloc=&output=embed" width="400" height="300" loading="lazy" style="border:0;" allowfullscreen=""></iframe>


          </figure>
        </section>
        <section class="contact-form">
          <h3 class="h3 form-title">Contact Form</h3>
          <form action="https://formsubmit.co/mzulfiqar3797@gmail.com" method="POST" class="form" data-form>
            <input type="hidden" name="_subject" value="Contacted from webpage">
            <div class="input-wrapper">
              <input type="text" name="fullname" class="form-input" placeholder="Full name" required data-form-input>
              <input type="email" name="email" class="form-input" placeholder="Email address" required data-form-input>
            </div>
            <textarea name="message" class="form-input" placeholder="Your Message" required data-form-input></textarea>
            <button class="form-btn" type="submit" disabled data-form-btn>
              <ion-icon name="paper-plane"></ion-icon>
              <span>Send Message</span>
            </button>
          </form>
        </section>
      </article>
    </div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.querySelector('[data-form]');
      const formInputs = form.querySelectorAll('[data-form-input]');
      const formButton = form.querySelector('[data-form-btn]');

      function validateForm() {
        const isValid = Array.from(formInputs).every(input => input.value.trim() !== '');
        formButton.disabled = !isValid;
      }

      formInputs.forEach(input => {
        input.addEventListener('input', function() {
          validateForm();
          if(input.name === 'fullname') {
            const subjectField = form.querySelector('input[name="_subject"]');
            if(subjectField) {
                subjectField.value = "Contacted from webpage - " + input.value;
            }
          }
        });
      });
    });
  </script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
